groups:
  - name: aplikasi
    rules:
      - alert: LayananAplikasiMati
        expr: up{job="aplikasi"} == 0
        for: 1m
        labels:
          severity: kritis
        annotations:
          summary: "Layanan backend aplikasi mati atau tidak bisa ditarik Prometheus"
          action: "Jalankan 'docker compose ps' lalu 'docker compose logs backend --tail=50' untuk memeriksa penyebab container berhenti."